name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # The repo installs with ignore-scripts (.npmrc), so the versioned
      # dependency patches in patches/ are applied explicitly; fails if one no
      # longer applies.
      - run: npm run patch:apply
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
