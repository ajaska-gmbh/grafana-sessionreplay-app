# Builds and publishes the plugin on a version tag (v1.2.3).
# With the repository secret GRAFANA_ACCESS_POLICY_TOKEN (Grafana Cloud access
# policy, scope plugins:write, from the org whose slug prefixes the plugin id)
# the zip is privately signed for the root URLs below; Grafana refuses to load
# it anywhere else. Without the secret the zip is unsigned and only loads where
# allow_loading_unsigned_plugins lists the plugin id.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ROOT_URLS: https://grafana.ajaska.de/,https://internalajaska.grafana.net/
  SIGN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN != '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "PLUGIN_ID=$(node -p "require('./src/plugin.json').id")" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

      - name: Sign (private, for our Grafana instances)
        if: env.SIGN == 'true'
        # The signer from package-lock (not @latest): it receives the signing token.
        run: npm run sign -- --rootUrls "${ROOT_URLS}"
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

      - name: Package
        run: |
          mv dist "${PLUGIN_ID}"
          zip -qr "${PLUGIN_ID}-${VERSION}.zip" "${PLUGIN_ID}"
          sha1sum "${PLUGIN_ID}-${VERSION}.zip" | cut -d' ' -f1 > "${PLUGIN_ID}-${VERSION}.zip.sha1"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${PLUGIN_ID}-${VERSION}.zip" "${PLUGIN_ID}-${VERSION}.zip.sha1" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            --notes "Signed: ${SIGN} (unsigned builds need allow_loading_unsigned_plugins = ajaska-sessionreplay-app)"
